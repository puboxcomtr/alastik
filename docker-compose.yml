version: '3.8'

services:
  # Next.js Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web/Dockerfile
    container_name: alastik_web
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3082
      NEXT_PUBLIC_CDN_URL: ${CDN_URL}
      NEXT_PUBLIC_ADMIN_URL: http://admin:3081
    depends_on:
      - api
    volumes:
      - ./apps/web/public:/app/public
    networks:
      - alastik_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Admin Panel
  admin:
    build:
      context: ./apps/admin
      dockerfile: ../../docker/admin/Dockerfile
    container_name: alastik_admin
    restart: unless-stopped
    ports:
      - "3081:3081"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3082
      NEXT_PUBLIC_ADMIN_URL: http://admin:3081
      NEXT_PUBLIC_SITE_URL: http://web:3080
      NEXT_PUBLIC_CDN_URL: ${CDN_URL}
      NEXTAUTH_URL: http://localhost:3081
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MONGODB_URI: mongodb://alastik:34gm4191M.@217.195.202.170:27017/alastik_db?authSource=admin
      DATABASE_URL: postgresql://alastik:34gm4191M.@217.195.202.170:5432/alastik_admin
    depends_on:
      - api
    volumes:
      - ./apps/admin/uploads:/app/uploads
    networks:
      - alastik_network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # Node.js Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api/Dockerfile
    container_name: alastik_api
    restart: unless-stopped
    ports:
      - "3082:3082"
    environment:
      NODE_ENV: production
      PORT: 3082
      MONGODB_URI: mongodb://alastik:34gm4191M.@217.195.202.170:27017/alastik_db?authSource=admin
      REDIS_URL: redis://:34gm4191M.@217.195.202.170:6379
      REDIS_HOST: 217.195.202.170
      REDIS_PORT: 6379
      REDIS_PASSWORD: 34gm4191M.
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

    volumes:
      - ./apps/api/uploads:/usr/src/app/uploads
      - ./apps/api/logs:/usr/src/app/logs
    networks:
      - alastik_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Elasticsearch for Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: alastik_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - alastik_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: alastik_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - web
      - admin
      - api
    networks:
      - alastik_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # MongoDB Backup Service - Merkezi Sunucu
  mongo-backup:
    image: mongo:7.0
    container_name: alastik_backup
    restart: unless-stopped
    environment:
      MONGO_HOST: 217.195.202.170
      MONGO_PORT: 27017
      MONGO_DB: alastik_db
      MONGO_USERNAME: alastik
      MONGO_PASSWORD: 34gm4191M.
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - alastik_network


volumes:
  elasticsearch_data:
    driver: local

networks:
  alastik_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 